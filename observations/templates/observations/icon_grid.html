{% extends "base_table.html" %}
{% block content %}
{% load static %}
<div class="row d-flex">
    {% load render_table from django_tables2 %}
    {% render_table table %}
    {% for icon in icons %}
    <div id="icon_card" class="card col-1 border border-secondar-subtle mb-3 text-center rounded me-2 d-none" >
        <div class="card-body">
            <img src="{{ icon.url }}" alt="{{ icon.name }}" loading="lazy" />
        </div>
        <div class="card-footer">
            <small class="b-block text-muted text-break">{{ icon.name }}</small>
        </div>
    </div>
    {% empty %}
    <div class="alert alert-warning">No weather icons found.</div>
    {% endfor %}
</div>
{% endblock %}
