{% extends "base_table.html" %}
{% block title %}{{ page_name }} | WIMP3 | National Meteorological Service of Belize{% endblock %}
{% block content %}
{% load static %}
<div class="row">
    <div class="col-12">
        {% load render_table from django_tables2 %}
        {% render_table table %}
    </div>
</div>
{% endblock %}
{% block extra_js %}
<script type="text/javascript">
$(document).ready(function () {

    let filterTimer;

    function filterTable() {

        const form = $("#table_filter");

        $.ajax({
            url: window.location.pathname,
            type: "GET",
            data: form.serialize(),
            success: function (response) {
                const newTable = $(response).find("#table_general_forecast").html();
                $("#table_general_forecast").html(newTable);
            },
            error: function (xhr) {
                console.error("Filter error:", xhr.responseText);
            }
        });
    }

    // Search as user types
    $("#id_forecast_time").on("keyup", function () { clearTimeout(filterTimer);  filterTimer = setTimeout(function () { filterTable(); }, 300); });

    $("#id_forecast_date").on("change", function () { filterTable(); });
    $("#id_created_by").on("change", function () { filterTable(); });
    $("#id_forecast_category").on("change", function () { filterTable(); });
});
</script>
{% endblock %}
