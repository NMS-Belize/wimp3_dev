{% extends "base.html" %}
{% load static %}
{% block title %}{{ page_name }} | WIMP3{% endblock %}
{% block content %}
<div class="row mb-4">
    <div class="col-12 mb-3">
        <h3 class="dashboard_title">Alert Modules</h3>
    </div>
    <div class="col-12 d-flex flex-row mb-3">
        <div class="item_dashboard position-relative">
            <a class="position-absolute top-50 start-50 translate-middle" href="{% url 'alerts:cap_alerts_list' %}">
                <img src="{% static 'button_icons/cap_logo.png' %}" alt="District Forecasts" />
                <span class="task_desc">CAP Alerts</span>
            </a>
        </div>
        <div class="item_dashboard position-relative">
            <a class="position-absolute top-50 start-50 translate-middle" href="{% url 'alerts:tropical_alerts_list' %}">
                <img src="{% static 'button_icons/storm.png' %}" alt="General Weather Forecasts" />
                <span class="task_desc">Tropical Weather Alerts</span>
            </a>
        </div>
    </div>
</div>
<div class="row">
    <div class="col-12 mb-3">
        <h3 class="dashboard_title">Alerts Parameters</h3>
    </div>
    <div class="col-12 d-flex flex-row mb-3">
        <div class="item_dashboard position-relative">
            <a class="position-absolute top-50 start-50 translate-middle" href="{% url 'alerts:tropical_alerts_category_list' %}">
                <img src="{% static 'button_icons/alert.png' %}" alt="Device Category" />
                <span class="task_desc">Tropical Weather Alert Category</span>
            </a>
        </div>
    </div>
</div>
{% endblock %}
