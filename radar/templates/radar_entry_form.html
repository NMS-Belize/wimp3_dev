{% extends "base_form.html" %}
{% load static %}
{% block title %}{{ page_name }} | Radar Services | WIMP3 | National Meteorological Service of Belize{% endblock %}
{% block content %}
<div class="row">
    <div class="col-12">
        <form method="post">
            {% csrf_token %}
            <div class="row">
                <div class="col-6">
                    {{ form.as_p }}
                    <input id="btn_submit" type="submit" value="Submit" class="btn btn_submit" />
                </div>
            </div>
        </form>
    </div>
</div>
{% endblock %}
