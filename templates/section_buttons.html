{% load static %}
<div class="d-flex justify-content-between bg-wimp-light gap-4 text-uppercase px-4 py-3 fw-bold mb-3">
    <div>{{ page_name }}</div>
    <div class="d-flex justify-content-end">
        {% if back_url %}
        <a class="btn-link text-teal-1 px-2 text-decoration-none" href="{{ back_url }}"><i class="fa-solid fa-list"></i>&nbsp;{{ prev_page }} List</a>
        {% endif %}
        {% if new_url %}
        <a class="btn-link text-teal-1 px-2 text-decoration-none" href="{{ new_url }}"><i class="fa-regular fa-file"></i>&nbsp;New Entry</a>
        {% endif %}
        {% if weburl %}
        <a class="btn-link text-teal-1 px-2 text-decoration-none" href="{{ back_url }}">Go to Live Page</a>
        {% endif %}
    </div>
</div>
