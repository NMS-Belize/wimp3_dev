{% extends "base_form.html" %}
{% load static %}
{% block content %}
<div class="mb-3 text-end">
    {% if previous_entry %}
        <a href="{% url 'forecasts:marine_forecast_entry' previous_entry.id %}" class="btn btn-sm btn-primary"><i class="fa-solid fa-chevron-left me-2"></i>Previous</a>
    {% endif %}
    {% if next_entry %}
        <a href="{% url 'forecasts:marine_forecast_entry' next_entry.id %}" class="btn btn-sm btn-primary"> Next <i class="fa-solid fa-chevron-right ms-2"></i></a>
    {% endif %}
</div>
<form method="post">
    {% csrf_token %}
    {% include "marine-forecast/tab_nav.html" %}
    <!--<button type="button" class="btn btn_new btn-sm" data-bs-toggle="modal" data-bs-target="#addInstructionModal"><i class="fa-solid fa-circle-plus"></i>&nbsp;Add Instruction</button>-->
    <div class="modal fade" id="modal_delete_tide" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h3 class="modal-title">Delete Tide Entry</h3>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div id="instructionError" name="instructionError" class="text-danger mb-2"></div>
                    <div class="form-group">
                        <label class="form-label">Are you sure you want to delete this entry? <em>This action is non-recoverable!</em></label>
                        <div class="fw-bold font-danger"></div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn_submit_close btn_submit btn btn-primary" id="saveInstructionBtn">Proceed</button>
                    <button type="button" class="btn_close btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                </div>
            </div>
        </div>
    </div>
    <div class="col-12 mt-3">
        <button id="btn_submit" name="submit_action" type="submit" value="continue" class="btn btn-success me-2" >Save & Continue</button>
        <button id="btn_submit_close" name="submit_action" type="submit" value="close" class="btn btn-primary me-2">Save & Close</button>
        <a id="btn_close" class="btn btn-danger" href="{{ back_url }}">Cancel</a>
    </div>
</form>
{% endblock %}
{% block extra_js %}
<script type="text/javascript">
$(document).ready(function () {

    $('#id_cap_alerts').select2({
        width: '100%',
        placeholder: 'Select CAP Alerts',
        allowClear: true,
        templateResult: function(data) {
            if (!data.id) {
                return data.text;
            }
            const option = $(data.element);
            const title  = option.data('title') || '';
            const author = option.data('author') || '';
            const date   = option.data('date') || '';
            const expdate   = option.data('expdate') || '';
            const isExpired = expdate && new Date(expdate) < new Date();

            let formattedDate = '';

            if (date) {
                formattedDate = new Date(date).toLocaleString('en-US', {
                    month: 'short',
                    day: '2-digit',
                    year: 'numeric',
                    hour: 'numeric',
                    minute: '2-digit',
                    hour12: true
                });
            }

            if (expdate) {
                formattedExpDate = new Date(date).toLocaleString('en-US', {
                    month: 'short',
                    day: '2-digit',
                    year: 'numeric',
                    hour: 'numeric',
                    minute: '2-digit',
                    hour12: true
                });
            }

            if(isExpired){
                return $(`
                    <div>
                        <div class="fw-bold">${title}</div>
                        <div class="small text-muted">${author} &bull; PubDate: ${formattedDate} | ExpDate: ${formattedExpDate}</div>
                    </div>
                `);
            
            }
            else{
                return $(`
                    <div>
                        <div class="fw-bold">${title}</div>
                        <div class="small text-muted">${author} &bull; PubDate: ${formattedDate} | ExpDate: <span class="text-success fw-bold">${formattedExpDate}</span></div>
                    </div>
                `);
            } 
        },
        templateSelection: function(data) {
            if (!data.id) {
                return data.text;
            }
            return $(data.element).data('title') || data.text;
        }
    });

    $('#id_tropical_alerts').select2({
        placeholder: 'Select Tropical Alerts',
        width: '100%',
        closeOnSelect: false,
    });

    /*$('.inline-edit-select2').select2({
        width: '100%',
        placeholder: 'Select wind direction',
        allowClear: true
    });*/

    $(".select-wind-direction").select2({
        width: "100%",
        placeholder: 'Select wind direction',
        allowClear: true
    });

    $(".select-sea-state").select2({
        width: "100%",
        placeholder: 'Select wind direction',
        allowClear: true
    });

    $(document).on("change", ".details-inline-edit", function () {

        const input = $(this);

        $.ajax({
            url: "{% url 'forecasts:marine_forecast_details_inline_update' %}",
            type: "POST",
            data: {
                id: input.data("id"),
                field: input.data("field"),
                value: input.val(),
                csrfmiddlewaretoken: "{{ csrf_token }}"
            },
            success: function (response) {
                console.log("Saved:", response);
                input.addClass("is-valid");
                setTimeout(function () { input.removeClass("is-valid"); }, 1000);
            },
            error: function (xhr) {
                console.error(xhr.responseText);
                input.addClass("is-invalid");
            }
        });
    });

    $(document).on("change", ".tides-inline-edit", function () {

        const input = $(this);

        $.ajax({
            url: "{% url 'forecasts:marine_forecast_tides_inline_update' %}",
            type: "POST",
            data: {
                id: input.data("id"),
                field: input.data("field"),
                value: input.val(),
                csrfmiddlewaretoken: "{{ csrf_token }}"
            },
            success: function (response) {
                console.log("Saved:", response);
                input.addClass("is-valid").removeClass("is-invalid");
                setTimeout(function () { input.removeClass("is-valid"); }, 1000);
                $("#alert_tide").html("");
            },
            error: function (xhr) {
                console.error(xhr.responseText);
                input.addClass("is-invalid");
                const errorMessage = xhr.responseJSON?.error || "An error occurred.";
                $("#alert_tide").html('<div class="alert alert-danger alert-dismissable">' + errorMessage + '</div>');
            }
        });
    });

    $(document).on("change", ".sun-inline-edit", function () {

        const input = $(this);

        $.ajax({
            url: "{% url 'forecasts:sun_inline_update' %}",
            type: "POST",
            data: {
                id: input.data("id"),
                field: input.data("field"),
                value: input.val(),
                csrfmiddlewaretoken: "{{ csrf_token }}"
            },
            success: function (response) {
                console.log("Saved:", response);
                input.addClass("is-valid");
                input.removeClass("is-invalid");
                setTimeout(function () { input.removeClass("is-valid"); }, 1000);
                $("#alert_sun").html("");
            },
            error: function (xhr) {
                console.error(xhr.responseText);
                input.addClass("is-invalid");
                const errorMessage = xhr.responseJSON?.error || "An error occurred.";
                $("#alert_sun").html('<div class="alert alert-danger alert-dismissable">' + errorMessage + '</div>');
            }
        });
    });

    $(document).on("change", ".moon-inline-edit", function () {

        const input = $(this);

        $.ajax({
            url: "{% url 'forecasts:moon_inline_update' %}",
            type: "POST",
            data: {
                id: input.data("id"),
                field: input.data("field"),
                value: input.val(),
                csrfmiddlewaretoken: "{{ csrf_token }}"
            },
            success: function (response) {
                console.log("Saved:", response);
                input.addClass("is-valid");
                input.removeClass("is-invalid");
                setTimeout(function () { input.removeClass("is-valid"); }, 1000);
                $("#alert_moon").html("");
            },
            error: function (xhr) {
                console.error(xhr.responseText);
                input.addClass("is-invalid");
                const errorMessage = xhr.responseJSON?.error || "An error occurred.";
                $("#alert_moon").html('<div class="alert alert-danger alert-dismissable">' + errorMessage + "</div>");
            }
        });
    });

    $(document).on('change', '.inline-edit-select2', function () {

        const select = $(this);

        $.ajax({
            url: "{% url 'forecasts:marine_forecast_details_inline_update' %}",
            type: "POST",

            data: {
                id: select.data("id"),
                field: select.data("field"),
                values: select.val(),
                csrfmiddlewaretoken: "{{ csrf_token }}"
            },
            traditional: true,
            success: function (response) {
                console.log("Saved", response);
            },
            error: function (xhr) {
                console.error(xhr.responseText);
            }
        });
    });

    $('#id_wind_shift_direction_m2m').select2({ placeholder: 'Select Wind Shift Direction', width: '100%', closeOnSelect: false });
    $('#id_wind_condition_m2m').select2({ placeholder: 'Select Wind Condition(s)', width: '100%', closeOnSelect: false });
    $('#id_wind_shift_condition_m2m').select2({ placeholder: 'Select Wind Condition(s)', width: '100%', closeOnSelect: false });
    $('#id_sea_state_m2m').select2({ placeholder: 'Select Sea State', width: '100%', closeOnSelect: false });
    $('#id_sea_state_shift_m2m').select2({ placeholder: 'Select Sea State', width: '100%', closeOnSelect: false });*/
});
</script>
{% endblock %}
